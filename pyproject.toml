[project]
name = "nodeadline"
authors = [
    { name = "Nodeadline", email = "nikolai@riabets.com" },
]
description = "Nodeadline marketing website — runs on ERPNext / Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # No extra Python dependencies. frappe is installed and managed by bench —
    # do NOT list it here.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Advertise the Frappe version this app targets. Frappe Cloud's custom-app
# validator requires this table; the bench's Frappe (v15) must satisfy the
# range or the deploy reports "Incompatible app version".
[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017",
    "B018",
    "B023",
    "B904",
    "E101",
    "E402",
    "E501",
    "E741",
    "F401",
    "F403",
    "F405",
    "F722",
    "W191",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
